server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;      # web/dist 内容拷到这里
    index index.html;

    # 前端静态资源（hash 路由，需回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式输出必须关闭缓冲，否则前端收不到逐字结果
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
